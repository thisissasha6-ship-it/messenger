<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мессенджер</title>
<style>
:root{--bg:#fff;--hover:#f4f4f5;--acc:#3390ec;--tx:#000;--mut:#707579;--line:#e7e7e9;--in:#fff;--out:#eeffde;--outTx:#000;--wall:#c9dfc0;--inp:#f4f4f5;--ok:#4fae4e;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#212121;--hover:#2c2c2c;--acc:#8774e1;--tx:#fff;--mut:#aaa;--line:#0f0f0f;--in:#212121;--out:#766ac8;--outTx:#fff;--wall:#0f0f0f;--inp:#2c2c2c;--ok:#a0e08f}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.hide{display:none!important}
button{font:inherit;cursor:pointer}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--mut);display:grid;place-items:center;flex-shrink:0}
.ib:hover{background:var(--hover)}
.ib svg{width:24px;height:24px;fill:currentColor}
input,textarea{font:inherit;color:var(--tx)}
/* вход */
.auth{height:100%;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.logo{width:96px;height:96px;border-radius:50%;background:var(--acc);margin:0 auto 4px;display:grid;place-items:center}
.logo svg{width:48px;height:48px;fill:#fff}
.card h1{font-size:26px}
.card input{height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg);outline:none;font-size:16px}
.card input:focus{border-color:var(--acc)}
.btn{height:50px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:16px}
.lnk{background:none;border:0;color:var(--acc);font-size:15px}
.err{color:#e53935;font-size:14px;min-height:18px}
/* приложение */
.app{display:flex;height:100%}
.side{width:360px;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px}
.search{flex:1;height:40px;border:0;border-radius:20px;background:var(--inp);padding:0 16px;font-size:15px;outline:none}
.list{overflow-y:auto;flex:1}
.chat{display:flex;gap:10px;padding:9px 12px;margin:0 6px;border-radius:10px;cursor:pointer;align-items:center}
.chat:hover{background:var(--hover)}
.chat.on{background:var(--acc);color:#fff}
.chat.on .sub,.chat.on .tm{color:#ffffffcc}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:20px;flex-shrink:0;position:relative}
.av.sm{width:42px;height:42px;font-size:16px}
.dot{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:#4fae4e;border:2px solid var(--bg)}
.mid{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;color:var(--mut);flex-shrink:0}
.sub{font-size:15px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bdg{min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 6px;margin-top:2px}
.chat.on .bdg{background:#fff;color:var(--acc)}
.note{padding:24px;text-align:center;color:var(--mut);font-size:15px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--wall)}
.hd{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--line);min-height:56px}
.hd .grow{flex:1;min-width:0}
.st{font-size:13px;color:var(--mut)}.st.on{color:var(--acc)}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.msg{max-width:min(480px,80%);padding:5px 9px 4px;border-radius:12px;font-size:15.5px;line-height:1.35;background:var(--in);box-shadow:0 1px 1px #0000001a;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--out);color:var(--outTx);border-bottom-right-radius:4px}
.msg.you{align-self:flex-start;border-bottom-left-radius:4px}
.msg.pic{padding:3px 3px 4px}
.msg.pic .cap{padding:4px 7px 0}
.msg img{display:block;max-width:100%;max-height:340px;border-radius:9px;cursor:zoom-in;background:#0001;min-width:120px;min-height:80px;object-fit:cover}
.meta{float:right;margin:8px 0 -3px 10px;font-size:12px;color:var(--mut);display:flex;gap:3px;align-items:center}
.me .meta{color:var(--ok)}
.msg.pic .meta{margin:0 7px 0 10px}
.meta svg{width:16px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8}
.bar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px 10px}
.box{flex:1;display:flex;align-items:flex-end;background:var(--bg);border-radius:22px;padding:0 4px;box-shadow:0 1px 1px #0000001a}
.box textarea{flex:1;border:0;background:none;padding:12px 6px;resize:none;outline:none;max-height:140px;height:46px;line-height:22px;font-size:15.5px}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);display:grid;place-items:center;flex-shrink:0}
.send svg{width:22px;height:22px;fill:#fff}
.empty{margin:auto;background:#00000040;color:#fff;padding:4px 14px;border-radius:14px;font-size:14px}
/* просмотр картинки */
.lb{position:fixed;inset:0;background:#000e;z-index:50;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb .tb{display:flex;justify-content:flex-end;gap:6px;padding:8px}
.lb .ib{color:#fff}
.lb .ib:hover{background:#fff2}
.lb .im{flex:1;display:grid;place-items:center;overflow:auto;padding:0 8px 12px}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
/* звонок */
.call{position:fixed;inset:0;background:#111;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;padding:calc(30px + env(safe-area-inset-top,0px)) 20px calc(30px + env(safe-area-inset-bottom,0px))}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#lv{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:100px;height:140px;object-fit:cover;border-radius:12px;background:#333;z-index:2;transform:scaleX(-1)}
.call .who{position:relative;z-index:1;text-align:center;text-shadow:0 1px 4px #000a}
.call .who b{display:block;font-size:26px}
.ctl{position:relative;z-index:1;display:flex;gap:18px}
.cb{width:62px;height:62px;border-radius:50%;border:0;background:#fff3;color:#fff;font-size:24px;display:grid;place-items:center}
.cb.red{background:#e53935}.cb.grn{background:#43a047}
.cb svg{width:28px;height:28px;fill:#fff}
.cb.red svg{transform:rotate(135deg)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;z-index:80;max-width:90%;text-align:center}
@media (max-width:760px){
.side{width:100%;border:0}
.main{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transform:translateX(100%);transition:transform .2s;z-index:5}
.app.open .main{transform:none}
.back{display:grid}
}
@media (prefers-reduced-motion:reduce){.main{transition:none}}
*{scrollbar-width:thin;scrollbar-color:#8885 transparent}
.msg{user-select:text}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (min-width:761px){
.side{width:clamp(300px,28vw,400px)}
.main{position:relative}
.msgs{padding:16px max(16px,calc((100% - 780px)/2))}
.bar{padding-left:max(10px,calc((100% - 780px)/2));padding-right:max(10px,calc((100% - 780px)/2))}
.msg{max-width:min(520px,70%)}
.card{max-width:380px}
.chat{padding:8px 10px}
#rv{object-fit:contain}
.main.drop::after{content:"Отпустите, чтобы отправить картинку";position:absolute;inset:12px;border:2px dashed var(--acc);border-radius:16px;background:#000a;color:#fff;display:grid;place-items:center;font-size:18px;z-index:20;pointer-events:none}
}
</style>
</head>
<body>

<div id="auth" class="auth">
  <div class="card">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></div>
    <h1 id="ttl">Вход</h1>
    <input id="un" placeholder="Логин" autocapitalize="off" autocorrect="off">
    <input id="nm" class="hide" placeholder="Имя">
    <input id="pw" type="password" placeholder="Пароль">
    <div class="err" id="err"></div>
    <button class="btn" id="go">Войти</button>
    <button class="lnk" id="sw">Создать аккаунт</button>
  </div>
</div>

<div id="app" class="app hide">
  <aside class="side">
    <div class="top">
      <button class="ib" id="out" aria-label="Выйти"><svg viewBox="0 0 24 24"><path d="M10 17l1.4-1.4L8.8 13H20v-2H8.8l2.6-2.6L10 7l-5 5zM4 5h8V3H4a2 2 0 00-2 2v14a2 2 0 002 2h8v-2H4z"/></svg></button>
      <input class="search" id="q" placeholder="Поиск (Ctrl+K)" aria-label="Поиск">
    </div>
    <div class="list" id="list"></div>
  </aside>
  <section class="main">
    <div id="empty" class="empty" style="margin:auto">Выберите чат или найдите человека по логину</div>
    <div id="pane" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="hd">
        <button class="ib back" id="back" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
        <div class="av sm" id="hav"></div>
        <div class="grow"><div class="nm" id="hnm"></div><div class="st" id="hst"></div></div>
        <button class="ib" id="vc" aria-label="Аудиозвонок"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11 11 0 003.5.56 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.2.2 2.4.56 3.5a1 1 0 01-.25 1z"/></svg></button>
        <button class="ib" id="vv" aria-label="Видеозвонок"><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11z"/></svg></button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="bar">
        <div class="box">
          <button class="ib" id="att" aria-label="Прикрепить картинку"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 01-8 0V5a2.5 2.5 0 015 0v10.5a1 1 0 01-2 0V6H10v9.5a2.5 2.5 0 005 0V5a4 4 0 00-8 0v12.5a5.5 5.5 0 0011 0V6z"/></svg></button>
          <textarea id="inp" rows="1" placeholder="Сообщение" aria-label="Сообщение"></textarea>
        </div>
        <button class="send" id="send" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
      </div>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif" class="hide">
    </div>
  </section>
</div>

<div id="lb" class="lb hide">
  <div class="tb">
    <button class="ib" id="dl" aria-label="Скачать"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg></button>
    <button class="ib" id="lx" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
  </div>
  <div class="im"><img id="lbi" alt="Картинка"></div>
</div>

<div id="call" class="call hide">
  <video id="rv" autoplay playsinline></video>
  <video id="lv" autoplay playsinline muted></video>
  <div class="who"><b id="cn"></b><span id="cs"></span></div>
  <div class="ctl">
    <button class="cb grn hide" id="ca" aria-label="Принять"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11 11 0 003.5.56 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.2.2 2.4.56 3.5a1 1 0 01-.25 1z"/></svg></button>
    <button class="cb hide" id="cm" aria-label="Микрофон">🎙</button>
    <button class="cb hide" id="cc" aria-label="Камера">📷</button>
    <button class="cb red" id="ce" aria-label="Завершить"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11 11 0 003.5.56 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.2.2 2.4.56 3.5a1 1 0 01-.25 1z"/></svg></button>
  </div>
</div>
<div id="toast" class="toast hide"></div>

<script src="supabase.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>')</script>
<script>
const SB_URL = 'https://jbshvqnutujptnrbcgwd.supabase.co';
const SB_KEY = 'sb_publishable_u9gcK9sPoFMHNxo69JYwLw_BziGa_Et';
// TURN-сервер для звонков между мобильными сетями (необязательно), например:
// {urls:'turn:адрес:3478', username:'логин', credential:'пароль'}
const TURN = null;
const ICE = [{ urls: 'stun:stun.l.google.com:19302' }].concat(TURN ? [TURN] : []);
const sb = supabase.createClient(SB_URL, SB_KEY);

const $ = i => document.getElementById(i);
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const COL = ['#e17076', '#7bc862', '#e5ca77', '#65aadd', '#a695e7', '#ee7aae', '#6ec9cb', '#faa774'];
let me, peer, msgs = [], rows = [], online = new Set(), mode = 'login', lbPath = '', sig, pres, started = false;

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16) }));
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML };
const hm = ts => { const d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) };
const ini = n => (n || '?').trim().charAt(0).toUpperCase();
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COL[h % COL.length] };
const av = (u, c) => '<div class="av ' + (c || '') + '" style="background:' + hue(u.id) + '">' + esc(ini(u.name)) + (online.has(u.id) && !c ? '<span class="dot"></span>' : '') + '</div>';
const tick = '<svg viewBox="0 0 18 12"><path d="M1 6.5l3.5 3.5L11 2M7 10l.5.5L15 2"/></svg>';
const imgUrl = (p, dl) => sb.storage.from('images').getPublicUrl(p, dl ? { download: true } : undefined).data.publicUrl;
let tt; function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('hide'); clearTimeout(tt); tt = setTimeout(() => e.classList.add('hide'), 2600) }

/* ---------- вход и регистрация ---------- */
// Supabase требует email, поэтому логин превращается в служебный адрес. Письма не отправляются.
const mail = u => u + '@gmail.com';
function authMode(m) {
  mode = m; $('err').textContent = '';
  $('ttl').textContent = m === 'login' ? 'Вход' : 'Регистрация';
  $('go').textContent = m === 'login' ? 'Войти' : 'Зарегистрироваться';
  $('sw').textContent = m === 'login' ? 'Создать аккаунт' : 'У меня уже есть аккаунт';
  $('nm').classList.toggle('hide', m === 'login');
}
$('sw').onclick = () => authMode(mode === 'login' ? 'register' : 'login');
function errTx(e) {
  const m = (e.message || '').toLowerCase();
  if (m.includes('already registered')) return 'Этот логин уже занят';
  if (m.includes('invalid login')) return 'Неверный логин или пароль';
  if (m.includes('database error')) return 'Не удалось создать профиль, попробуйте другой логин';
  if (m.includes('rate limit')) return 'Слишком много попыток, подождите минуту';
  if (m.includes('fetch') || m.includes('network')) return 'Нет связи с сервером';
  return e.message;
}
$('go').onclick = async () => {
  const un = $('un').value.trim().toLowerCase(), pw = $('pw').value, nm = $('nm').value.trim();
  $('err').textContent = '';
  if (!/^[a-z0-9_]{3,20}$/.test(un)) return $('err').textContent = 'Логин: 3–20 символов, латиница, цифры, _';
  if (pw.length < 6) return $('err').textContent = 'Пароль: минимум 6 символов';
  $('go').disabled = true;
  const r = mode === 'login'
    ? await sb.auth.signInWithPassword({ email: mail(un), password: pw })
    : await sb.auth.signUp({ email: mail(un), password: pw, options: { data: { username: un, name: nm || un } } });
  $('go').disabled = false;
  if (r.error) return $('err').textContent = errTx(r.error);
  if (!r.data.session) return $('err').textContent = 'Аккаунт создан. Нажмите «Войти».';
  start(r.data.session.user);
};
$('out').onclick = async () => { await sb.auth.signOut(); location.reload() };

async function start(user) {
  if (started) return;
  const { data } = await sb.from('profiles').select('id,username,name').eq('id', user.id).single();
  if (!data) { await sb.auth.signOut(); return }
  started = true; me = data;
  $('auth').classList.add('hide'); $('app').classList.remove('hide');
  sb.channel('msgs')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'receiver=eq.' + me.id }, p => onMsg(p.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'sender=eq.' + me.id }, p => onMsg(p.new))
    .subscribe();
  pres = sb.channel('online', { config: { presence: { key: me.id } } });
  pres.on('presence', { event: 'sync' }, () => { online = new Set(Object.keys(pres.presenceState())); loadList(); head() })
    .subscribe(s => { if (s === 'SUBSCRIBED') pres.track({ t: Date.now() }) });
  sig = sb.channel('calls', { config: { broadcast: { self: false } } });
  sig.on('broadcast', { event: 'sig' }, ({ payload }) => onSig(payload)).subscribe();
  loadList();
}
sb.auth.getSession().then(({ data }) => { if (data.session) start(data.session.user) });

/* ---------- список чатов и поиск ---------- */
async function loadList() {
  if (!me) return;
  const q = $('q').value.trim().replace(/[^\p{L}\p{N}_]/gu, '');
  if (q) {
    const { data } = await sb.from('profiles').select('id,username,name').neq('id', me.id)
      .or('username.ilike.%' + q + '%,name.ilike.%' + q + '%').limit(20);
    rows = data || [];
  } else {
    const { data: ms } = await sb.from('messages').select('*').or('sender.eq.' + me.id + ',receiver.eq.' + me.id)
      .order('created_at', { ascending: false }).limit(500);
    const last = {}, unread = {};
    (ms || []).forEach(m => {
      const o = m.sender === me.id ? m.receiver : m.sender;
      if (!last[o]) last[o] = m;
      if (m.receiver === me.id && !m.seen) unread[o] = (unread[o] || 0) + 1;
    });
    const ids = Object.keys(last);
    const ps = ids.length ? (await sb.from('profiles').select('id,username,name').in('id', ids)).data || [] : [];
    rows = ids.map(id => ({ ...(ps.find(x => x.id === id) || { id, name: '?', username: '' }), last: last[id], unread: unread[id] || 0 }));
  }
  const un = rows.reduce((s, u) => s + (u.unread || 0), 0);
  document.title = (un ? '(' + un + ') ' : '') + 'Мессенджер';
  $('list').innerHTML = rows.length ? rows.map((u, i) => {
    const on = peer && peer.id === u.id ? ' on' : '';
    const pre = q ? '@' + esc(u.username) : (u.last.sender === me.id ? 'Вы: ' : '') + (u.last.image ? '🖼 Фото' + (u.last.body ? ', ' : '') : '') + esc(u.last.body);
    return '<div class="chat' + on + '" data-i="' + i + '">' + av(u) + '<div class="mid"><div class="row"><span class="nm">' + esc(u.name) + '</span><span class="tm">' + (u.last && !q ? hm(u.last.created_at) : '') + '</span></div><div class="row"><span class="sub">' + pre + '</span>' + (u.unread ? '<span class="bdg">' + u.unread + '</span>' : '') + '</div></div></div>';
  }).join('') : '<div class="note">' + (q ? 'Никого не нашли' : 'Чатов пока нет. Найдите человека по логину в поиске.') + '</div>';
}
$('list').onclick = e => { const c = e.target.closest('.chat'); if (c) openChat(rows[+c.dataset.i]) };
$('q').oninput = loadList;

/* ---------- переписка ---------- */
async function markSeen() {
  await sb.from('messages').update({ seen: true }).eq('sender', peer.id).eq('receiver', me.id).eq('seen', false);
  loadList();
}
async function openChat(u) {
  peer = { id: u.id, name: u.name, username: u.username };
  const { data } = await sb.from('messages').select('*')
    .or('and(sender.eq.' + me.id + ',receiver.eq.' + peer.id + '),and(sender.eq.' + peer.id + ',receiver.eq.' + me.id + ')')
    .order('created_at', { ascending: false }).limit(200);
  msgs = (data || []).reverse();
  $('empty').classList.add('hide'); $('pane').classList.remove('hide');
  $('app').classList.add('open');
  head(); draw(); markSeen(); if (innerWidth > 760) $('inp').focus();
}
function head() {
  if (!peer) return;
  $('hav').outerHTML = av(peer, 'sm').replace('class="av sm"', 'id="hav" class="av sm"');
  $('hnm').textContent = peer.name;
  const on = online.has(peer.id);
  $('hst').textContent = on ? 'в сети' : 'не в сети'; $('hst').className = 'st' + (on ? ' on' : '');
}
function draw() {
  $('msgs').innerHTML = msgs.length ? msgs.map(m => {
    const mine = m.sender === me.id;
    const meta = '<span class="meta">' + hm(m.created_at) + (mine ? tick : '') + '</span>';
    if (m.image) return '<div class="msg pic ' + (mine ? 'me' : 'you') + '"><img src="' + imgUrl(m.image) + '" data-f="' + esc(m.image) + '" alt="Фото" loading="lazy">' + (m.body ? '<div class="cap">' + esc(m.body) + '</div>' : '') + meta + '</div>';
    return '<div class="msg ' + (mine ? 'me' : 'you') + '">' + esc(m.body) + meta + '</div>';
  }).join('') : '<div class="empty">Напишите первое сообщение</div>';
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
function onMsg(m) {
  const other = m.sender === me.id ? m.receiver : m.sender;
  if (peer && other === peer.id) {
    if (!msgs.some(x => x.id === m.id)) { msgs.push(m); draw() }
    if (m.sender === peer.id) markSeen();
  }
  loadList();
}
async function send(img) {
  const t = $('inp').value.trim();
  if (!peer || (!t && !img)) return;
  $('inp').value = ''; $('inp').style.height = '46px';
  const { data, error } = await sb.from('messages').insert({ sender: me.id, receiver: peer.id, body: t, image: img || null }).select().single();
  if (error) { toast('Не отправлено'); $('inp').value = t; return }
  if (!msgs.some(x => x.id === data.id)) { msgs.push(data); draw() }
  loadList();
}
$('send').onclick = () => send();
$('inp').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); send() } };
$('inp').oninput = function () { this.style.height = '46px'; this.style.height = Math.min(this.scrollHeight, 140) + 'px' };
function closeChat() {
  $('app').classList.remove('open'); peer = null;
  if (innerWidth > 760) { $('pane').classList.add('hide'); $('empty').classList.remove('hide'); }
  loadList();
}
$('back').onclick = closeChat;

/* ---------- картинки ---------- */
$('att').onclick = () => $('file').click();
async function uploadImage(f) {
  if (!f || !peer) return;
  const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif' }[f.type];
  if (!ext) return toast('Поддерживаются JPG, PNG, WebP и GIF');
  if (f.size > 15 * 1024 * 1024) return toast('Картинка больше 15 МБ');
  toast('Отправка…');
  const path = me.id + '/' + uuid() + '.' + ext;
  const { error } = await sb.storage.from('images').upload(path, f, { contentType: f.type });
  if (error) return toast('Не удалось загрузить картинку');
  send(path);
}
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; uploadImage(f) };
$('msgs').onclick = e => { const i = e.target.closest('img[data-f]'); if (i) { lbPath = i.dataset.f; $('lbi').src = imgUrl(lbPath); $('lb').classList.remove('hide') } };
$('lx').onclick = () => $('lb').classList.add('hide');
$('lb').onclick = e => { if (e.target.classList.contains('im') || e.target === $('lb')) $('lb').classList.add('hide') };
$('dl').onclick = async () => {
  const url = imgUrl(lbPath, true), fn = lbPath.split('/').pop();
  const FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
  if (NATIVE && FS) {
    try { await FS.downloadFile({ url, path: 'Messenger/' + fn, directory: 'DOCUMENTS', recursive: true }); toast('Сохранено: Documents/Messenger') }
    catch (e) { toast('Не удалось сохранить') }
  } else {
    const a = document.createElement('a'); a.href = url; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
  }
};

/* ---------- звонки (WebRTC, сигналы через Supabase Realtime) ---------- */
let pc, stream, callPeer = null, offer = null, queue = [], micOn = true, camOn = true;
const emit = p => sig.send({ type: 'broadcast', event: 'sig', payload: { ...p, from: me.id, name: me.name } });
function callUI(name, status, st) {
  $('call').classList.remove('hide'); $('cn').textContent = name; $('cs').textContent = status;
  $('ca').classList.toggle('hide', st !== 'in'); $('cm').classList.toggle('hide', st !== 'live'); $('cc').classList.toggle('hide', st !== 'live');
}
function mkPC(id) {
  pc = new RTCPeerConnection({ iceServers: ICE });
  pc.onicecandidate = e => e.candidate && emit({ type: 'ice', to: id, c: e.candidate.toJSON() });
  pc.ontrack = e => { $('rv').srcObject = e.streams[0] };
  pc.onconnectionstatechange = () => {
    if (pc && pc.connectionState === 'connected') $('cs').textContent = 'Соединено';
    if (pc && ['failed', 'closed'].includes(pc.connectionState)) endCall(false, 'Связь потеряна');
  };
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
}
async function media(video) {
  stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: 'user' } : false });
  $('lv').srcObject = stream; $('lv').classList.toggle('hide', !video); micOn = camOn = true;
}
async function flush() { while (queue.length) await pc.addIceCandidate(queue.shift()).catch(() => {}) }
async function startCall(video) {
  if (callPeer || !peer) return;
  callPeer = peer.id; callUI(peer.name, 'Вызов…', 'out');
  try { await media(video) } catch (e) { toast('Нет доступа к микрофону или камере'); return endCall(false) }
  mkPC(callPeer);
  const o = await pc.createOffer(); await pc.setLocalDescription(o);
  emit({ type: 'offer', to: callPeer, sdp: { type: o.type, sdp: o.sdp }, video });
}
async function onSig(d) {
  if (!d || d.to !== me.id) return;
  if (d.type === 'offer') {
    if (callPeer) return emit({ type: 'end', to: d.from, busy: 1 });
    callPeer = d.from; offer = d; callUI(d.name, d.video ? 'Видеозвонок' : 'Аудиозвонок', 'in');
  } else if (d.type === 'answer' && pc && d.from === callPeer) {
    await pc.setRemoteDescription(d.sdp); await flush(); callUI($('cn').textContent, 'Соединение…', 'live');
  } else if (d.type === 'ice' && d.from === callPeer) {
    pc && pc.remoteDescription ? pc.addIceCandidate(d.c).catch(() => {}) : queue.push(d.c);
  } else if (d.type === 'end' && d.from === callPeer) {
    endCall(false, d.busy ? 'Абонент занят' : 'Звонок завершён');
  }
}
$('ca').onclick = async () => {
  const d = offer; offer = null;
  try { await media(d.video) } catch (e) { toast('Нет доступа к микрофону или камере'); return endCall(true) }
  mkPC(d.from); await pc.setRemoteDescription(d.sdp); await flush();
  const a = await pc.createAnswer(); await pc.setLocalDescription(a);
  emit({ type: 'answer', to: d.from, sdp: { type: a.type, sdp: a.sdp } }); callUI($('cn').textContent, 'Соединение…', 'live');
};
function endCall(notify, msg) {
  if (notify && callPeer) emit({ type: 'end', to: callPeer });
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (pc) { pc.onconnectionstatechange = null; pc.close() }
  pc = stream = callPeer = offer = null; queue = [];
  $('rv').srcObject = $('lv').srcObject = null; $('call').classList.add('hide');
  if (msg) toast(msg);
}
$('ce').onclick = () => endCall(true);
$('vc').onclick = () => startCall(false);
$('vv').onclick = () => startCall(true);
$('cm').onclick = () => { micOn = !micOn; stream.getAudioTracks().forEach(t => t.enabled = micOn); $('cm').textContent = micOn ? '🎙' : '🔇' };
$('cc').onclick = () => { camOn = !camOn; stream.getVideoTracks().forEach(t => t.enabled = camOn); $('cc').textContent = camOn ? '📷' : '🚫' };

/* ---------- удобство на компьютере ---------- */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); $('q').select(); return }
  if (e.key !== 'Escape') return;
  if (!$('lb').classList.contains('hide')) $('lb').classList.add('hide');
  else if (!$('call').classList.contains('hide')) return;
  else if (document.activeElement === $('q') && $('q').value) { $('q').value = ''; loadList() }
  else if (peer) closeChat();
});
$('inp').addEventListener('paste', e => {
  const f = [...((e.clipboardData && e.clipboardData.files) || [])].find(x => x.type.startsWith('image/'));
  if (f) { e.preventDefault(); uploadImage(f) }
});
const mainEl = document.querySelector('.main');
['dragenter', 'dragover'].forEach(ev => mainEl.addEventListener(ev, e => { e.preventDefault(); mainEl.classList.add('drop') }));
['dragleave', 'drop'].forEach(ev => mainEl.addEventListener(ev, e => { e.preventDefault(); mainEl.classList.remove('drop') }));
mainEl.addEventListener('drop', e => { const f = [...e.dataTransfer.files].find(x => x.type.startsWith('image/')); if (f) uploadImage(f) });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
</script>
</body>
